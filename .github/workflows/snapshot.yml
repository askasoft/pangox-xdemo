name: Snapshot Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment: build
    env:
      GO111MODULE: on
      GOPROXY: https://proxy.golang.org
      XTEST: FALSE

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: actions/setup-go@v7
        with:
          go-version-file: './go.mod'

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --verbose

      - name: Test
        run: go test -covermode=atomic -coverprofile=coverage.out $(go list ./...)

      - name: Build
        run: |
          mkdir dist
          GOOS=linux GOARCH=amd64 ./build.sh dist/xdemo-linux-amd64
          GOOS=linux GOARCH=arm64 ./build.sh dist/xdemo-linux-arm64

      - name: Delete Existing Snapshot Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete snapshot --yes || true

      - name: Delete Existing Snapshot Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin :refs/tags/snapshot || true

      - name: Create Snapshot Tag
        run: |
          git tag -f snapshot
          git push origin snapshot --force

      - name: Create Snapshot Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create snapshot \
            dist/* \
            --title "Snapshot Build" \
            --notes "Latest build from master branch"
